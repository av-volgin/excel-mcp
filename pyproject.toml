[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "excel-mcp"
version = "0.1.0"
description = "MCP server for reading Excel files with formula-aware parsing"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Andrey Volgin", email = "av.volgin@gmail.com" },
]
keywords = ["mcp", "excel", "xlsx", "openpyxl", "formulas"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "mcp>=1.0.0",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
formulas = ["formualizer>=0.5.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
excel-mcp = "excel_mcp.server:main"

[project.urls]
Homepage = "https://github.com/avolgin/excel-mcp"
Repository = "https://github.com/avolgin/excel-mcp"
Issues = "https://github.com/avolgin/excel-mcp/issues"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
